<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Quiz | Rocket Workshop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

<div class="quiz-container">

    <div class="quiz-box">

        <h2>Quiz Tehnic</h2>
        <p class="question">Care este rolul centrului de presiune într-o rachetă?</p>

        <div class="answers">
            <button class="answer" onclick="selectAnswer(this)">Determină viteza maximă</button>
            <button class="answer" onclick="selectAnswer(this)">Influențează stabilitatea zborului</button>
            <button class="answer" onclick="selectAnswer(this)">Controlează consumul de combustibil</button>
            <button class="answer" onclick="selectAnswer(this)">Reduce temperatura motorului</button>
        </div>

        <button class="next-btn">Next →</button>

    </div>

</div>

<script>
function selectAnswer(element) {
    document.querySelectorAll('.answer').forEach(btn => btn.classList.remove('checked'));
    element.classList.add('checked');
}
</script>

</body>
</html>
