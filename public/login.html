<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Quiz - Echipe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Important pentru padding */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Autentificare Echipă</h2>
    <form id="loginForm">
        <input type="text" id="team_name" placeholder="Nume Echipă (ex: Echipa 1)" required>
        <input type="password" id="password" placeholder="Parolă" required>
        <button type="submit">Intră în Quiz</button>
    </form>
    <div id="errorBox" class="error-msg"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Oprim reîncărcarea paginii

        const team_name = document.getElementById('team_name').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('errorBox');

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                // Trimitem obiectul cu cheile astea exact cum le asteapta server.js
                body: JSON.stringify({ team_name, password })
            });

            if (response.ok) {
                // Daca serverul a raspuns cu succes, mergem la quiz
                window.location.href = '/quiz.html';
            } else {
                // Daca a dat eroare (401 sau 404), afisam mesajul primit de la server
                const message = await response.text();
                errorBox.innerText = message;
                errorBox.style.display = 'block';
            }
        } catch (error) {
            console.error("Eroare la comunicarea cu serverul:", error);
            errorBox.innerText = "Serverul nu raspunde. Verifica daca ai pornit node server.js";
            errorBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
