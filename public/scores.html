<!DOCTYPE html>

<link rel="stylesheet" href="style.css">

<h1>Scorurile mele</h1>

<div id="scores"></div>

<a href="/logout">Logout</a>

<script>

fetch("/myscores")

.then(r=>r.json())

.then(data=>{

let html = "";

data.forEach(s=>{

html += `<p>${s.score} puncte - ${s.created_at}</p>`;

});

document.getElementById("scores").innerHTML = html;

});

</script>
