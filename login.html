<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Login | Rocket Workshop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Tinos:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="stars-overlay"></div>

<div class="login-container">
    <div class="login-box">

        <h1>Login</h1>
        <p class="subtitle">Accesează contul tău</p>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="ex: nume@email.com" required>
            </div>

            <div class="input-group">
                <label>Parolă</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button class="btn">Login</button>
        </form>

    </div>
</div>

</body>
</html>
